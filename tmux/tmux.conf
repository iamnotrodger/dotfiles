set -g mouse on
set-option -sg escape-time 10

# OSC8 hyperlink support
set -g allow-passthrough on
set -ga terminal-features ",*:hyperlinks"

set -g focus-events on

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g history-limit 20000

# use vi mode
setw -g mode-keys vi
set -g status-keys vi

# vim-like yank
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# navigation
bind v split-window -h -c '#{pane_current_path}'
bind b split-window -v -c '#{pane_current_path}'

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

#switch windows
bind -r C-h previous-window
bind -r C-l next-window

bind-key x kill-pane
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

unbind C-b
set -g prefix C-Space

# styling
set -g popup-border-lines rounded
set -g popup-style "bg=terminal,fg=terminal"
set -g popup-border-style "bg=terminal,fg=terminal"

set -g pane-border-style "fg=terminal,dim,bg=terminal,dim"

# status
set -g status-position top
set -g status-style "bg=terminal"
set -g status-right ""
set -g status-left "#[fg=green,bg=terminal]#[bg=green,fg=terminal,bold]  #S #[fg=green,bg=terminal] "
set -g status-left-length 30

set -g @color_vim "green"
set -g @color_ai "orange"
set -g @color_k8s "blue"
set -g @color_default "terminal"

set -g @icon_vim ""
set -g @icon_ai ""
set -g @icon_k8s "󱃾"
set -g @icon_default ""

set -g @window_color "\
#{?#{m/ri:nvim,#W},#[fg=#{@color_vim}],\
#{?#{m/ri:claude,#W},#[fg=#{@color_ai}],\
#{?#{m/ri:k9s,#W},#[fg=#{@color_k8s}],\
#[fg=#{@color_default}]}}}"

set -g @window_icon "\
#{?#{m/ri:nvim,#W},#{@icon_vim},\
#{?#{m/ri:claude,#W},#{@icon_ai},\
#{?#{m/ri:k9s,#W},#{@icon_k8s},\
#{@icon_default}}}}"

set -g window-status-format "#[dim]#{E:@window_color} #{E:@window_icon}  #W "
set -g window-status-current-format "#[bold]#{E:@window_color} #{E:@window_icon}  #W "

# LazyGit
bind "J" display-popup \
  -d "#{pane_current_path}" \
  -w 80% -h 80% \
  -E "lazygit"

# Sesh + Gum
bind-key "K" display-popup -E -w 40% "sesh connect \"$(
 sesh list -i | gum filter --limit 1 --no-sort --fuzzy --placeholder 'Pick a sesh' --height 50 --prompt='⚡' --padding '1 2'
)\""
